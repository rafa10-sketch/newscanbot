version: "3.9"

services:
  pentestbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: pentestbot:v2
    container_name: pentestbot_v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /home/pentestbot
      PENTESTBOT_DATA_DIR: /app/data
      PENTESTBOT_LOGS_DIR: /app/logs
      PENTESTBOT_REPORTS_DIR: /app/reports
      PENTESTBOT_WORK_DIR: /app/data/work
      PENTESTBOT_DB_PATH: /app/data/pentestbot.db
      PENTESTBOT_API_HOST: 0.0.0.0
      PENTESTBOT_API_PORT: 8080
      ENABLE_WEB_DISCOVERY: ${ENABLE_WEB_DISCOVERY:-true}
      MAX_DISCOVERED_URLS: ${MAX_DISCOVERED_URLS:-150}
      ENABLE_GOBUSTER: ${ENABLE_GOBUSTER:-true}
      GOBUSTER_TIMEOUT: ${GOBUSTER_TIMEOUT:-180}
      ENABLE_DIRSEARCH: ${ENABLE_DIRSEARCH:-false}
      DIRSEARCH_TIMEOUT: ${DIRSEARCH_TIMEOUT:-240}
      ENABLE_FINGERPRINT: ${ENABLE_FINGERPRINT:-true}
      ENABLE_SSLYZE: ${ENABLE_SSLYZE:-true}
      ENABLE_NIKTO: ${ENABLE_NIKTO:-false}
      ENABLE_WPSCAN: ${ENABLE_WPSCAN:-false}
      ENABLE_JOOMSCAN: ${ENABLE_JOOMSCAN:-false}
      ENABLE_S3SCANNER: ${ENABLE_S3SCANNER:-false}
      ENABLE_SQLMAP: ${ENABLE_SQLMAP:-false}
      SQLMAP_TIMEOUT: ${SQLMAP_TIMEOUT:-600}
      ENABLE_DALFOX: ${ENABLE_DALFOX:-false}
      DALFOX_TIMEOUT: ${DALFOX_TIMEOUT:-600}
      DALFOX_REQUEST_TIMEOUT: ${DALFOX_REQUEST_TIMEOUT:-10}
      DALFOX_WORKERS: ${DALFOX_WORKERS:-20}
      DALFOX_MAX_TARGETS_PER_HOST: ${DALFOX_MAX_TARGETS_PER_HOST:-30}
      DALFOX_DEEP_SCAN: ${DALFOX_DEEP_SCAN:-false}
    volumes:
      - pentestbot_data:/app/data
      - pentestbot_logs:/app/logs
      - pentestbot_reports:/app/reports
      - nuclei_templates:/home/pentestbot/.config/nuclei
    expose:
      - "8080"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python3 main.py --check-tools >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  pentestbot_data:
  pentestbot_logs:
  pentestbot_reports:
  nuclei_templates:
